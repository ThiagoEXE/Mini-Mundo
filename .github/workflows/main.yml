name: CI/CD Docker Hub

on:
  push:
    tags:
      - '*' # O gatilho é qualquer tag, o filtro real está no 'if' abaixo

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # SEU REGEX APLICADO AQUI:
    if: |
      contains(github.ref, 'refs/tags/') && 
      matches(github.ref_name, '^(v|V)?([0-9]+\.)?([0-9]+\.)?(\*|[0-9]+).?(hf[0-9]+|Hf[0-9]+|HF[0-9]+)?$')
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: actions/docker-login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: actions/docker-setup-buildx-action@v3

      - name: Build and Push
        uses: actions/docker-build-push-action@v5
        with:
          context: .
          push: true
          # Nome da sua imagem (Ex: usuario/laravel-app)
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/seu-app-nome:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/seu-app-nome:latest
          # Otimização de build
          cache-from: type=gha
          cache-to: type=gha,mode=max